name: Collect Seveneves free asset packs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list eligible packs (no downloads)"
        required: true
        type: boolean
        default: false
      limit:
        description: "Maximum packs to process (0 = all eligible packs)"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Grindstone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collect eligible packs
        run: |
          ARGS=(--out seven_eves_downloads --limit "${{ inputs.limit }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python tools/seveneves_downloader.py "${ARGS[@]}"

      - name: Package results
        if: always()
        run: |
          if [ -d seven_eves_downloads ]; then
            zip -qr seven-eves-results.zip seven_eves_downloads
          fi

      - name: Upload downloadable results
        if: always() && hashFiles('seven-eves-results.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: seven-eves-asset-collection
          path: seven-eves-results.zip
          if-no-files-found: warn
          retention-days: 7
